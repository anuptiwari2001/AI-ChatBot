<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatGPT Clone</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #212121; --sidebar: #171717; --hover: #2f2f2f; --input: #2f2f2f;
      --text: #ececec; --muted: #8e8e8e; --secondary: #b4b4b4;
      --border: #333; --accent: #10a37f; --danger: #ef4444;
      --radius: 12px; --sidebar-w: 260px;
    }
    html, body, #root { height: 100%; width: 100%; overflow: hidden; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    textarea { font-family: inherit; resize: none; }
    .app { display: flex; height: 100%; width: 100%; }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-w); background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; flex-shrink: 0;
      transition: transform 0.2s;
    }
    .sidebar-header { padding: 12px; border-bottom: 1px solid var(--border); }
    .new-chat-btn {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);
      font-size: 14px; transition: background 0.15s;
    }
    .new-chat-btn:hover { background: var(--hover); }
    .sidebar-history { flex: 1; overflow-y: auto; padding: 8px; }
    .history-label { font-size: 12px; color: var(--muted); padding: 8px 10px 4px; font-weight: 500; }
    .history-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border-radius: 8px; font-size: 14px; color: var(--secondary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      cursor: default;
    }
    .sidebar-footer { padding: 12px; border-top: 1px solid var(--border); }
    .clear-btn {
      display: flex; align-items: center; gap: 8px; width: 100%;
      padding: 10px 12px; border-radius: 8px; font-size: 13px;
      color: var(--secondary); transition: background 0.15s, color 0.15s;
    }
    .clear-btn:hover { background: var(--hover); color: var(--danger); }

    /* Main */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .main-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px; border-bottom: 1px solid var(--border); gap: 12px;
    }
    .main-header h1 { font-size: 16px; font-weight: 600; }
    .model-badge {
      font-size: 12px; color: var(--muted); background: var(--hover);
      padding: 4px 10px; border-radius: 20px;
    }
    .error-banner {
      background: #3b1219; color: #f87171; padding: 10px 16px;
      font-size: 13px; text-align: center; border-bottom: 1px solid #7f1d1d;
    }

    /* Messages */
    .messages { flex: 1; overflow-y: auto; padding: 24px 0; scroll-behavior: smooth; }
    .messages-inner { max-width: 768px; margin: 0 auto; padding: 0 16px; }
    .message { display: flex; gap: 16px; padding: 20px 0; }
    .avatar {
      width: 32px; height: 32px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 13px; font-weight: 600;
    }
    .message.user .avatar { background: #5436da; color: #fff; }
    .message.assistant .avatar { background: var(--accent); color: #fff; }
    .content {
      flex: 1; min-width: 0; line-height: 1.7; font-size: 15px;
      white-space: pre-wrap; word-break: break-word;
    }

    /* Empty */
    .empty {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100%; text-align: center;
      padding: 40px 20px; color: var(--secondary);
    }
    .empty h2 { font-size: 28px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
    .empty p { font-size: 15px; margin-bottom: 32px; max-width: 400px; }
    .suggestions {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
      max-width: 560px; width: 100%;
    }
    .suggestion {
      text-align: left; padding: 14px 16px; border: 1px solid var(--border);
      border-radius: var(--radius); font-size: 14px; color: var(--secondary);
      transition: background 0.15s, border-color 0.15s; line-height: 1.4;
    }
    .suggestion:hover { background: var(--hover); border-color: #444; color: var(--text); }
    .suggestion strong { display: block; color: var(--text); margin-bottom: 2px; font-weight: 500; }

    /* Input */
    .input-area { padding: 16px 16px 24px; flex-shrink: 0; }
    .input-wrapper { max-width: 768px; margin: 0 auto; }
    .input-box {
      display: flex; align-items: flex-end; gap: 8px;
      background: var(--input); border: 1px solid var(--border);
      border-radius: 16px; padding: 12px 14px; transition: border-color 0.15s;
    }
    .input-box:focus-within { border-color: #555; }
    .input-box textarea {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-size: 15px; line-height: 1.5;
      max-height: 200px; min-height: 24px; padding: 0;
    }
    .input-box textarea::placeholder { color: var(--muted); }
    .send-btn {
      width: 36px; height: 36px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      background: var(--text); color: var(--bg); flex-shrink: 0; transition: opacity 0.15s;
    }
    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .send-btn:not(:disabled):hover { background: #fff; }
    .hint { text-align: center; font-size: 12px; color: var(--muted); margin-top: 10px; }

    /* Typing */
    .typing { display: flex; gap: 5px; padding: 4px 0; }
    .typing span {
      width: 7px; height: 7px; background: var(--muted); border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .typing span:nth-child(1) { animation-delay: -0.32s; }
    .typing span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    .menu-btn {
      display: none; width: 36px; height: 36px;
      align-items: center; justify-content: center; border-radius: 8px;
    }
    .menu-btn:hover { background: var(--hover); }
    .overlay { display: none; }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed; left: 0; top: 0; bottom: 0; z-index: 100;
        transform: translateX(-100%);
      }
      .sidebar.open { transform: translateX(0); }
      .overlay {
        display: block; position: fixed; inset: 0;
        background: rgba(0,0,0,0.5); z-index: 99;
      }
      .menu-btn { display: flex; }
      .suggestions { grid-template-columns: 1fr; }
    }

    .messages::-webkit-scrollbar, .sidebar-history::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-thumb, .sidebar-history::-webkit-scrollbar-thumb {
      background: #444; border-radius: 3px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback } = React;

    const API_BASE = 'http://127.0.0.1:8000';
    // Each browser tab/profile gets its own conversation on the server.
    const SESSION_ID = (() => {
      try {
        let id = localStorage.getItem('chat_session');
        if (!id) { id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2)); localStorage.setItem('chat_session', id); }
        return id;
      } catch { return 'default'; }
    })();

    const SUGGESTIONS = [
      { title: 'Explain quantum computing', subtitle: 'in simple terms' },
      { title: 'Write a Python function', subtitle: 'to reverse a linked list' },
      { title: 'Help me plan a trip', subtitle: 'to Japan for 10 days' },
      { title: 'Summarize the benefits', subtitle: 'of learning TypeScript' },
    ];

    function App() {
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [model, setModel] = useState('');
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const endRef = useRef(null);
      const taRef = useRef(null);

      useEffect(() => {
        endRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, loading]);

      useEffect(() => {
        const el = taRef.current;
        if (el) {
          el.style.height = 'auto';
          el.style.height = Math.min(el.scrollHeight, 200) + 'px';
        }
      }, [input]);

      const sendMessage = async (text) => {
        const trimmed = (text || '').trim();
        if (!trimmed || loading) return;

        setError(null);
        setInput('');
        setMessages(prev => [...prev, { role: 'user', content: trimmed }]);
        setLoading(true);
        setSidebarOpen(false);

        try {
          const res = await fetch(`${API_BASE}/chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: trimmed, session_id: SESSION_ID }),
          });
          if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            throw new Error(data.detail || `Request failed (${res.status})`);
          }
          const data = await res.json();
          setMessages(prev => [...prev, { role: 'assistant', content: data.reply }]);
          if (data.model) setModel(data.model);
        } catch (err) {
          setError(err.message || 'Failed to reach the server. Is the backend running on port 8000?');
        } finally {
          setLoading(false);
          taRef.current?.focus();
        }
      };

      const clearHistory = async () => {
        try {
          await fetch(`${API_BASE}/history?session_id=${encodeURIComponent(SESSION_ID)}`, { method: 'DELETE' });
          setMessages([]);
          setError(null);
        } catch {
          setError('Could not clear history');
        }
      };

      const onKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage(input);
        }
      };

      return (
        <div className="app">
          {sidebarOpen && <div className="overlay" onClick={() => setSidebarOpen(false)} />}

          <aside className={`sidebar ${sidebarOpen ? 'open' : ''}`}>
            <div className="sidebar-header">
              <button className="new-chat-btn" onClick={clearHistory}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <path d="M12 5v14M5 12h14" />
                </svg>
                New chat
              </button>
            </div>
            <div className="sidebar-history">
              <div className="history-label">This conversation</div>
              {messages.filter(m => m.role === 'user').length === 0 ? (
                <div className="history-item" style={{ opacity: 0.5 }}>No messages yet</div>
              ) : (
                messages.filter(m => m.role === 'user').slice(-8).map((m, i) => (
                  <div key={i} className="history-item" title={m.content}>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                    </svg>
                    {m.content.slice(0, 40)}{m.content.length > 40 ? '…' : ''}
                  </div>
                ))
              )}
            </div>
            <div className="sidebar-footer">
              <button className="clear-btn" onClick={clearHistory}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <polyline points="3 6 5 6 21 6" />
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                </svg>
                Clear conversation
              </button>
            </div>
          </aside>

          <main className="main">
            <header className="main-header">
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <button className="menu-btn" onClick={() => setSidebarOpen(true)} aria-label="Menu">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <line x1="3" y1="12" x2="21" y2="12" />
                    <line x1="3" y1="6" x2="21" y2="6" />
                    <line x1="3" y1="18" x2="21" y2="18" />
                  </svg>
                </button>
                <h1>ChatGPT Clone</h1>
              </div>
              <span className="model-badge">{model}</span>
            </header>

            {error && <div className="error-banner">{error}</div>}

            <div className="messages">
              {messages.length === 0 && !loading ? (
                <div className="empty">
                  <h2>How can I help you today?</h2>
                  <p>Powered by Groq · Connected to your FastAPI backend</p>
                  <div className="suggestions">
                    {SUGGESTIONS.map(s => (
                      <button key={s.title} className="suggestion"
                        onClick={() => sendMessage(s.title + ' ' + s.subtitle)}>
                        <strong>{s.title}</strong>
                        {s.subtitle}
                      </button>
                    ))}
                  </div>
                </div>
              ) : (
                <div className="messages-inner">
                  {messages.map((m, i) => (
                    <div key={i} className={`message ${m.role}`}>
                      <div className="avatar">{m.role === 'user' ? 'U' : 'AI'}</div>
                      <div className="content">{m.content}</div>
                    </div>
                  ))}
                  {loading && (
                    <div className="message assistant">
                      <div className="avatar">AI</div>
                      <div className="content">
                        <div className="typing"><span /><span /><span /></div>
                      </div>
                    </div>
                  )}
                  <div ref={endRef} />
                </div>
              )}
            </div>

            <div className="input-area">
              <div className="input-wrapper">
                <div className="input-box">
                  <textarea
                    ref={taRef}
                    value={input}
                    onChange={e => setInput(e.target.value)}
                    onKeyDown={onKeyDown}
                    placeholder="Message ChatGPT Clone…"
                    rows={1}
                    disabled={loading}
                  />
                  <button
                    className="send-btn"
                    disabled={!input.trim() || loading}
                    onClick={() => sendMessage(input)}
                    aria-label="Send"
                  >
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                      <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                    </svg>
                  </button>
                </div>
                <p className="hint">Enter to send · Shift+Enter for new line · Backend: {API_BASE}</p>
              </div>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
